name: Android CI

on:
  push:
    branches: [ main, feat/libxposed-api102 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout (full history for versionCode)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;28.2.13676358"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Build debug APK
        run: bash ./gradlew assembleDebug --no-daemon --console=plain

      - name: Verify modern module declaration in APK
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          for entry in module.prop java_init.list scope.list native_init.list; do
            unzip -l "$apk" | grep -q "META-INF/xposed/$entry" || { echo "missing $entry"; exit 1; }
          done
          unzip -p "$apk" META-INF/xposed/module.prop

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TiebaTS-api102-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
