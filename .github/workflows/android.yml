name: Android CI

on:
  push:
    branches: [ main, feat/libxposed-api102 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout (full history for versionCode)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      # ubuntu-latest already ships an Android SDK. Avoid android-actions/setup-android@v3:
      # it tries to install the retired "tools" package and fails with cmdline-tools 16.0.
      - name: Install SDK components
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0"
          # AGP downloads the pinned NDK on demand when sdkmanager cannot provide it.
          "$SDKM" --install "ndk;28.2.13676358" || echo "NDK will be downloaded by AGP"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: bash ./gradlew assembleDebug --no-daemon --console=plain

      - name: Verify modern module declaration in APK
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          for entry in module.prop java_init.list scope.list native_init.list; do
            unzip -l "$apk" | grep -q "META-INF/xposed/$entry" || { echo "missing $entry"; exit 1; }
          done
          unzip -p "$apk" META-INF/xposed/module.prop
          if unzip -l "$apk" | grep -qE 'assets/(xposed|native)_init'; then
            echo "legacy entry point still present"; exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TiebaTS-api102-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
